<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Fibonacci Clock</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            color: #fff;
        }

        .clock-container {
            width: 100%;
            max-width: 900px;
            aspect-ratio: 8 / 5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            width: 100%;
            height: auto;
            border: 1px solid #fff;
        }

        /* Screen-reader only */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>

    <script type="module" src="fib.js"></script>
</head>

<body>
    <div class="clock-container">
        <canvas id="myCanvas" role="img" aria-labelledby="clock-text">
        </canvas>
    </div>

    <!-- Accessible textual clock -->
    <time id="clock-text" class="sr-only" aria-live="polite">
        Loading time…
    </time>
</body>

</html>
